name: Fetch Site Review Metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-site-review.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch site review metadata
        run: |
          node <<'NODE'
          const fs = await import('node:fs/promises');
          const base = 'https://amitai-new-zealand-trip.amitaywagner.chatgpt.site';
          for (const [url, file] of [
            [`${base}/visual-review/manifest.json`, 'source-site-manifest.json'],
            [`${base}/visual-review/e2e-results.json`, 'site-e2e-results.json'],
          ]) {
            try {
              const r = await fetch(url, { cache: 'no-store' });
              const text = await r.text();
              await fs.writeFile(file, text, 'utf8');
            } catch (e) {
              await fs.writeFile(file, JSON.stringify({fetchError:String(e)}, null, 2), 'utf8');
            }
          }

          const reviewIds = [
            'documents-overview','booking-with-documents','day-with-documents',
            'mobile-documents-overview','mobile-day-with-documents'
          ];
          const pages = [];
          const strip = html => html
            .replace(/<script[\s\S]*?<\/script>/gi,' ')
            .replace(/<style[\s\S]*?<\/style>/gi,' ')
            .replace(/<[^>]+>/g,' ')
            .replace(/&nbsp;/g,' ')
            .replace(/&amp;/g,'&')
            .replace(/&#x27;/g,"'")
            .replace(/\s+/g,' ')
            .trim();
          const snippets = (text, re) => {
            const out=[]; let m; const r=new RegExp(re.source, re.flags.includes('g')?re.flags:re.flags+'g');
            while((m=r.exec(text)) && out.length<12){const i=m.index; out.push(text.slice(Math.max(0,i-180), Math.min(text.length,i+420))); if(r.lastIndex===m.index) r.lastIndex++;}
            return out;
          };
          for (const id of reviewIds) {
            const url = `${base}/visual-review/pages/${id}`;
            try {
              const r = await fetch(url,{cache:'no-store'}); const html=await r.text(); const text=strip(html);
              pages.push({
                id,status:r.status,
                hasUploadText:/העלא|הוספ(?:ת|ה)?\s*מסמך|צרפ(?:ת|ה)?\s*מסמך|בחר\s*קובץ|upload/i.test(text),
                hasOpenText:/פתיח|פתיחה|open/i.test(text),
                hasDeleteText:/מחיק|delete/i.test(text),
                hasOfflineText:/אופליין|offline/i.test(text),
                hasSearchText:/חיפוש במסמכים/i.test(text),
                hasPersonalText:/מסמכים אישיים|personal/i.test(text),
                uploadSnippets:snippets(text,/העלא|הוספ(?:ת|ה)?\s*מסמך|צרפ(?:ת|ה)?\s*מסמך|בחר\s*קובץ|upload/i),
                documentSnippets:snippets(text,/מסמכ/i),
                offlineSnippets:snippets(text,/אופליין|offline/i),
              });
            } catch(e){pages.push({id,status:null,error:String(e)});}
          }

          const exposurePatterns=['passport','דרכון','תעודת זהות','personalDocument','Sample Hobbiton Ticket','Sample Hotel Voucher'];
          const exports={};
          for(const [name,url] of Object.entries({tripData:`${base}/trip-data.json`,tripReview:`${base}/trip-review.txt`})){
            try{const r=await fetch(url,{cache:'no-store'});const text=await r.text();exports[name]={status:r.status,exposure:{}};for(const pat of exposurePatterns)exports[name].exposure[pat]=text.toLowerCase().includes(pat.toLowerCase());}
            catch(e){exports[name]={status:null,error:String(e),exposure:{}};}
          }
          await fs.writeFile('site-document-metadata.json',JSON.stringify({generatedAt:new Date().toISOString(),pages,exports},null,2),'utf8');
          NODE

      - name: Publish metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-site-manifest.json site-e2e-results.json site-document-metadata.json || true
          if git diff --cached --quiet; then
            echo "No metadata changes"
          else
            git commit -m "Update site review metadata"
            git push
          fi

