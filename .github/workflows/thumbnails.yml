name: Build Visual Review Thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'screenshots/**'
      - '.github/workflows/thumbnails.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build compact thumbnails
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          names = [
              'now-trip-day-06',
              'desktop-wide-now-trip-day-06',
              'mobile-now-trip-day-06',
              'mobile-360-now-trip-day-06',
              'day-06-open',
              'mobile-day-06-command',
              'mobile-430-day-06-command',
              'day-no-breakfast-open',
              'booking-from-day-hobbiton',
              'day-to-map-hobbiton',
              'desktop-route-main-map',
              'desktop-days',
          ]
          out = Path('thumbnails')
          out.mkdir(exist_ok=True)
          for name in names:
              src = Path('screenshots') / f'{name}.png'
              if not src.exists():
                  continue
              with Image.open(src) as im:
                  im = im.convert('RGB')
                  target_w = 240
                  target_h = max(1, round(im.height * target_w / im.width))
                  im = im.resize((target_w, target_h), Image.Resampling.LANCZOS)
                  im.save(out / f'{name}.jpg', 'JPEG', quality=35, optimize=True, progressive=False)
          PY

      - name: Publish thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbnails || true
          if git diff --cached --quiet; then
            echo "No thumbnail changes to commit"
          else
            git commit -m "Update visual review thumbnails"
            git push
          fi
