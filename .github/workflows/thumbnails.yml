name: Build Visual Review Thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'screenshots/**'
      - 'regional-mobile.png'
      - 'regional-desktop.png'
      - '.github/workflows/thumbnails.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build compact thumbnails
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          names = [
              'now-trip-day-06',
              'desktop-wide-now-trip-day-06',
              'mobile-now-trip-day-06',
              'mobile-360-now-trip-day-06',
              'day-06-open',
              'mobile-day-06-command',
              'mobile-430-day-06-command',
              'day-no-breakfast-open',
              'booking-from-day-hobbiton',
              'day-to-map-hobbiton',
              'desktop-route-main-map',
              'desktop-days',
          ]
          out = Path('thumbnails')
          out.mkdir(exist_ok=True)
          previews = Path('previews')
          previews.mkdir(exist_ok=True)
          tiny = Path('tiny-previews')
          tiny.mkdir(exist_ok=True)

          def make_previews(src, name):
              if not src.exists():
                  return
              with Image.open(src) as im:
                  im = im.convert('RGB')
                  target_w = 240
                  target_h = max(1, round(im.height * target_w / im.width))
                  thumb = im.resize((target_w, target_h), Image.Resampling.LANCZOS)
                  thumb.save(out / f'{name}.jpg', 'JPEG', quality=35, optimize=True, progressive=False)

                  crop_h = min(im.height, 1000 if im.width >= 700 else 900)
                  top = im.crop((0, 0, im.width, crop_h))
                  preview_w = 300
                  preview_h = max(1, round(top.height * preview_w / top.width))
                  preview = top.resize((preview_w, preview_h), Image.Resampling.LANCZOS)
                  preview.save(previews / f'{name}-top.jpg', 'JPEG', quality=45, optimize=True, progressive=False)

                  tiny_w = 120
                  tiny_h = max(1, round(top.height * tiny_w / top.width))
                  tiny_img = top.resize((tiny_w, tiny_h), Image.Resampling.LANCZOS)
                  tiny_img.save(tiny / f'{name}-top.jpg', 'JPEG', quality=20, optimize=True, progressive=False)

          for name in names:
              make_previews(Path('screenshots') / f'{name}.png', name)

          make_previews(Path('regional-mobile.png'), 'regional-mobile')
          make_previews(Path('regional-desktop.png'), 'regional-desktop')
          PY

      - name: Publish thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbnails previews tiny-previews || true
          if git diff --cached --quiet; then
            echo "No thumbnail changes to commit"
          else
            git commit -m "Update visual review thumbnails"
            git push
          fi

