name: Precise Mobile Layout E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'layout-e2e.mjs'
      - '.github/workflows/layout-e2e.yml'

permissions:
  contents: write

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node layout-e2e.mjs
        continue-on-error: true
      - name: Publish result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add layout-e2e-results.json || true
          if git diff --cached --quiet; then
            echo "No layout result changes"
          else
            git commit -m "Update precise mobile layout results"
            git push
          fi
