name: Focused Document Vault Check
on:
  push:
    branches: [main]
    paths:
      - 'document-vault-audit.mjs'
      - '.github/workflows/overview-check.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node document-vault-audit.mjs
      - name: Publish focused results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add document-vault-audit document-vault-audit.json || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update document vault audit"
            git push
          fi
