name: Visual Review Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capture.mjs'
      - 'document-vault-audit.mjs'
      - 'package.json'
      - '.github/workflows/visual-review.yml'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: npm run capture
        continue-on-error: true

      - name: Audit document vault
        run: node document-vault-audit.mjs
        continue-on-error: true

      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-screenshots
          path: |
            screenshots/
            visual-review-manifest.json
            document-vault-audit/
            document-vault-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish screenshots to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots visual-review-manifest.json document-vault-audit document-vault-audit.json || true
          if git diff --cached --quiet; then
            echo "No review changes to commit"
          else
            git commit -m "Update visual review screenshots"
            git push
          fi
