name: Overview Navigator E2E
on:
  push:
    branches: [main]
    paths:
      - 'overview-e2e.mjs'
      - '.github/workflows/overview-e2e.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node overview-e2e.mjs
      - name: Publish result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overview-e2e-results.json || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update overview navigator E2E results"; git push; fi
